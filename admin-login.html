<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDSKN Admin Login</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

.header{
    background:#111;
    color:white;
    text-align:center;
    padding:30px 15px;
}

.header h1{
    color:#ffd000;
    margin:0;
    font-size:32px;
}

.header p{
    margin:8px 0 0;
    font-size:18px;
}

.container{
    max-width:450px;
    margin:50px auto;
    padding:30px;
    background:white;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#b8860b;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#b8860b;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#946f08;
}

#error{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#ffe0e0;
    color:red;
    border-radius:8px;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#333;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
    <h1>VDSKN.IN</h1>
    <p>Village Digital Seva Kendra</p>
</div>

<div class="container">

<h2>🔐 Admin Login</h2>

<form onsubmit="adminLogin(event)">

<label>👤 Admin Username</label>

<input
type="text"
id="username"
placeholder="Username ನಮೂದಿಸಿ"
required>

<label>🔑 Password</label>

<input
type="password"
id="password"
placeholder="Password ನಮೂದಿಸಿ"
required>

<button type="submit">
🔐 Admin Login
</button>

</form>

<div id="error">
❌ Username ಅಥವಾ Password ತಪ್ಪಾಗಿದೆ
</div>

<a class="back" href="index.html">
← Websiteಗೆ ಹಿಂದಿರುಗಿ
</a>

</div>

<script>

function adminLogin(event){

event.preventDefault();

let username =
document.getElementById("username").value;

let password =
document.getElementById("password").value;

/*
   ಈಗ ಪರೀಕ್ಷೆಗಾಗಿ:
   Username: admin
   Password: 1234
*/

if(username === "admin" && password === "1234"){

localStorage.setItem("adminLogin","true");

window.location.href="admin.html";

}else{

document.getElementById("error").style.display="block";

}

}

</script>

</body>
</html>
