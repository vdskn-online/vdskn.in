<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDSKN.IN - Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f5f5f5, #e8e8e8);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 90%;
    max-width: 420px;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    text-align: center;
}

.logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    margin-bottom: 10px;
}

h1 {
    color: #b00000;
    margin-bottom: 5px;
}

.subtitle {
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    text-align: left;
    margin: 12px 0 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.login-btn {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 8px;
    background: #087ee1;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:hover {
    background: #0568bd;
}

.back-btn {
    display: block;
    margin-top: 18px;
    color: #b00000;
    text-decoration: none;
    font-weight: bold;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="login-box">

    <img src="logo.png" class="logo" alt="VDSKN Logo">

    <h1>VDSKN.IN</h1>

    <p class="subtitle">
        Village Digital Seva Kendra
    </p>

    <form onsubmit="loginUser(event)">

        <label>📱 ಮೊಬೈಲ್ ಸಂಖ್ಯೆ</label>
        <input
            type="tel"
            id="mobile"
            placeholder="ನಿಮ್ಮ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
            maxlength="10"
            required
        >

        <label>🔐 ಪಾಸ್‌ವರ್ಡ್</label>
        <input
            type="password"
            id="password"
            placeholder="ಪಾಸ್‌ವರ್ಡ್ ನಮೂದಿಸಿ"
            required
        >

        <button type="submit" class="login-btn">
            🔓 ಲಾಗಿನ್
        </button>

    </form>

    <div id="message" class="message"></div>

    <a href="index.html" class="back-btn">
        ← ಮುಖ್ಯ ಪುಟಕ್ಕೆ ಹಿಂತಿರುಗಿ
    </a>

</div>

<script>

function loginUser(event) {

    event.preventDefault();

    const mobile = document.getElementById("mobile").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    /*
      Demo Login

      Mobile: 1234567890
      Password: 123456
    */

    if (mobile === "1234567890" && password === "123456") {

        message.style.color = "green";
        message.innerHTML = "✅ Login ಯಶಸ್ವಿಯಾಗಿದೆ...";

        setTimeout(function() {
            window.location.href = "dashboard.html";
        }, 1000);

    } else {

        message.style.color = "red";
        message.innerHTML = "❌ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ಅಥವಾ ಪಾಸ್‌ವರ್ಡ್ ತಪ್ಪಾಗಿದೆ.";

    }
}

</script>

</body>
</html>
