<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDSKN Login</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.login-box{
    width:360px;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
    text-align:center;
}

.logo{
    width:90px;
    height:90px;
    object-fit:contain;
    margin-bottom:10px;
}

h1{
    color:#c40000;
    margin:5px 0;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:8px;
    background:#087fdb;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#056bb8;
}

.back{
    display:block;
    margin-top:20px;
    text-decoration:none;
    color:#555;
}
</style>
</head>

<body>

<div class="login-box">

    <img src="logo.png" class="logo" alt="VDSKN Logo">

    <h1>VDSKN.IN</h1>

    <div class="subtitle">
        🔐 ಬಳಕೆದಾರರ ಲಾಗಿನ್
    </div>

    <input type="text" id="username"
           placeholder="ಮೊಬೈಲ್ ಸಂಖ್ಯೆ / Username">

    <input type="password" id="password"
           placeholder="Password">

    <button onclick="login()">
        🔐 ಲಾಗಿನ್
    </button>

    <a href="index.html" class="back">
        ← Homeಗೆ ಹಿಂತಿರುಗಿ
    </a>

</div>

<script>

function login(){

    var username =
        document.getElementById("username").value;

    var password =
        document.getElementById("password").value;

    if(username === "" || password === ""){
        alert("ದಯವಿಟ್ಟು Username ಮತ್ತು Password ನಮೂದಿಸಿ.");
        return;
    }

    /*
      ಈಗ testingಗಾಗಿ ಮಾತ್ರ.
      ಮುಂದೆ database/login system connect ಮಾಡುತ್ತೇವೆ.
    */

    if(username === "admin" && password === "1234"){

        alert("Login ಯಶಸ್ವಿಯಾಗಿದೆ!");

        window.location.href = "dashboard.html";

    }else{

        alert("Username ಅಥವಾ Password ತಪ್ಪಾಗಿದೆ.");

    }

}

</script>

</body>
</html>
