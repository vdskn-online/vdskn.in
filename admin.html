<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDSKN - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

.header{
    background:#111;
    color:white;
    text-align:center;
    padding:25px 15px;
}

.header h1{
    margin:0;
    color:#ffd000;
}

.header p{
    margin:7px 0;
}

.container{
    width:94%;
    max-width:900px;
    margin:25px auto;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:14px;
    box-shadow:0 3px 12px #ccc;
}

h2{
    color:#b8860b;
    border-bottom:2px solid #b8860b;
    padding-bottom:10px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

button{
    border:0;
    border-radius:8px;
    padding:13px 18px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.add{
    width:100%;
    margin-top:20px;
    background:#15957f;
    color:white;
}

.logout{
    background:#d32f2f;
    color:white;
    float:right;
}

.service{
    border:1px solid #ddd;
    padding:18px;
    margin-top:15px;
    border-radius:10px;
    background:#fafafa;
}

.service h3{
    margin-top:0;
    color:#333;
}

.edit{
    background:#1976d2;
    color:white;
    margin-right:8px;
}

.delete{
    background:#d32f2f;
    color:white;
}

#message{
    text-align:center;
    font-weight:bold;
    margin:15px 0;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}
</style>
</head>

<body>

<div class="header">

    <button class="logout" onclick="logout()">
        Logout
    </button>

    <h1>VDSKN.IN</h1>
    <p>Admin Panel</p>

</div>

<div class="container">

    <!-- ADD SERVICE -->

    <div class="card">

        <h2>➕ ಹೊಸ ಸೇವೆ ಸೇರಿಸಿ</h2>

        <label>ಸೇವೆಯ ಹೆಸರು</label>

        <input
            type="text"
            id="serviceName"
            placeholder="ಉದಾ: ಜಾತಿ ಪ್ರಮಾಣ ಪತ್ರ"
        >

        <label>ವಿಭಾಗ</label>

        <select id="category">

            <option value="">
                ವಿಭಾಗ ಆಯ್ಕೆ ಮಾಡಿ
            </option>

            <option value="ಕಂದಾಯ ಇಲಾಖೆ">
                ಕಂದಾಯ ಇಲಾಖೆ
            </option>

            <option value="ಶಿಕ್ಷಣ ಇಲಾಖೆ">
                ಶಿಕ್ಷಣ ಇಲಾಖೆ
            </option>

            <option value="ಆರೋಗ್ಯ ಇಲಾಖೆ">
                ಆರೋಗ್ಯ ಇಲಾಖೆ
            </option>

            <option value="ಕಾರ್ಮಿಕ ಇಲಾಖೆ">
                ಕಾರ್ಮಿಕ ಇಲಾಖೆ
            </option>

            <option value="ಸರ್ಕಾರಿ ಸೇವೆಗಳು">
                ಸರ್ಕಾರಿ ಸೇವೆಗಳು
            </option>

            <option value="ಇತರೆ">
                ಇತರೆ
            </option>

        </select>

        <label>ಬೇಕಾಗುವ ದಾಖಲೆಗಳು</label>

        <textarea
            id="documents"
            placeholder="1. ಆಧಾರ್ ಕಾರ್ಡ್
2. ರೇಷನ್ ಕಾರ್ಡ್
3. ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
        ></textarea>

        <label>ಸೇವೆಯ ಮಾಹಿತಿ</label>

        <textarea
            id="information"
            placeholder="ಈ ಸೇವೆಗೆ ಸಂಬಂಧಿಸಿದ ಹೆಚ್ಚಿನ ಮಾಹಿತಿ..."
        ></textarea>

        <button
            class="add"
            onclick="saveService()"
        >
            💾 ಸೇವೆ ಉಳಿಸಿ
        </button>

        <p id="message"></p>

    </div>


    <!-- SERVICE LIST -->

    <div class="card">

        <h2>📋 ಎಲ್ಲಾ ಸೇವೆಗಳು</h2>

        <div id="serviceList"></div>

    </div>

</div>


<script>

/* ADMIN CHECK */

if(localStorage.getItem("vds_kn_admin") !== "true"){

    window.location.href =
        "admin-login.html";

}


/* DEFAULT SERVICES */

let services =
    JSON.parse(
        localStorage.getItem("vds_kn_services")
    ) || [];


/* EDIT ID */

let editIndex = -1;


/* SAVE SERVICE */

function saveService(){

    const name =
        document.getElementById("serviceName")
        .value.trim();

    const category =
        document.getElementById("category")
        .value;

    const documents =
        document.getElementById("documents")
        .value.trim();

    const information =
        document.getElementById("information")
        .value.trim();


    if(!name){

        showMessage(
            "❌ ಸೇವೆಯ ಹೆಸರು ನಮೂದಿಸಿ"
        );

        return;
    }


    if(!category){

        showMessage(
            "❌ ವಿಭಾಗ ಆಯ್ಕೆ ಮಾಡಿ"
        );

        return;
    }


    const service = {

        name:name,

        category:category,

        documents:documents,

        information:information

    };


    if(editIndex === -1){

        services.push(service);

        showMessage(
            "✅ ಹೊಸ ಸೇವೆ ಸೇರಿಸಲಾಗಿದೆ"
        );

    }else{

        services[editIndex] = service;

        editIndex = -1;

        showMessage(
            "✅ ಸೇವೆ Update ಮಾಡಲಾಗಿದೆ"
        );

    }


    localStorage.setItem(
        "vds_kn_services",
        JSON.stringify(services)
    );


    clearForm();

    displayServices();

}


/* DISPLAY SERVICES */

function displayServices(){

    const list =
        document.getElementById(
            "serviceList"
        );

    list.innerHTML = "";


    if(services.length === 0){

        list.innerHTML =
            '<div class="empty">ಯಾವುದೇ ಸೇವೆ ಇಲ್ಲ</div>';

        return;
    }


    services.forEach(
        function(service,index){

            const div =
                document.createElement("div");

            div.className = "service";


            div.innerHTML = `

                <h3>
                    ${index + 1}. ${escapeHTML(service.name)}
                </h3>

                <p>
                    <b>ವಿಭಾಗ:</b>
                    ${escapeHTML(service.category)}
                </p>

                <p>
                    <b>ಬೇಕಾಗುವ ದಾಖಲೆಗಳು:</b><br>
                    ${formatText(service.documents)}
                </p>

                <p>
                    <b>ಸೇವೆಯ ಮಾಹಿತಿ:</b><br>
                    ${formatText(service.information)}
                </p>

                <button
                    class="edit"
                    onclick="editService(${index})"
                >
                    ✏️ Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteService(${index})"
                >
                    🗑️ Delete
                </button>

            `;


            list.appendChild(div);

        }
    );

}


/* EDIT */

function editService(index){

    const service =
        services[index];

    document.getElementById(
        "serviceName"
    ).value = service.name;

    document.getElementById(
        "category"
    ).value = service.category;

    document.getElementById(
        "documents"
    ).value = service.documents;

    document.getElementById(
        "information"
    ).value = service.information;


    editIndex = index;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* DELETE */

function deleteService(index){

    if(
        !confirm(
            "ಈ ಸೇವೆಯನ್ನು Delete ಮಾಡಬೇಕೇ?"
        )
    ){

        return;
    }


    services.splice(index,1);


    localStorage.setItem(
        "vds_kn_services",
        JSON.stringify(services)
    );


    displayServices();


    showMessage(
        "🗑️ ಸೇವೆ Delete ಮಾಡಲಾಗಿದೆ"
    );

}


/* CLEAR FORM */

function clearForm(){

    document.getElementById(
        "serviceName"
    ).value = "";

    document.getElementById(
        "category"
    ).value = "";

    document.getElementById(
        "documents"
    ).value = "";

    document.getElementById(
        "information"
    ).value = "";

    editIndex = -1;

}


/* MESSAGE */

function showMessage(text){

    const msg =
        document.getElementById("message");

    msg.innerText = text;

    setTimeout(
        function(){

            msg.innerText = "";

        },
        2500
    );

}


/* TEXT FORMAT */

function formatText(text){

    if(!text){

        return "ಮಾಹಿತಿ ಲಭ್ಯವಿಲ್ಲ";

    }

    return escapeHTML(text)
        .replace(/\n/g,"<br>");

}


/* SECURITY */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* LOGOUT */

function logout(){

    localStorage.removeItem(
        "vds_kn_admin"
    );

    window.location.href =
        "admin-login.html";

}


/* START */

displayServices();

</script>

</body>
</html>
