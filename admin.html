<!DOCTYPE html>
<html lang="kn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VDSKN Admin Panel</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
}

.header{
background:#111;
color:white;
padding:25px;
text-align:center;
}

.header h1{
margin:0;
color:#ffd000;
}

.container{
width:95%;
max-width:900px;
margin:25px auto;
}

.card{
background:white;
padding:22px;
border-radius:14px;
box-shadow:0 3px 12px #ccc;
margin-bottom:20px;
}

h2{
color:#b8860b;
border-bottom:2px solid #ddd;
padding-bottom:10px;
}

label{
display:block;
font-weight:bold;
margin-top:15px;
margin-bottom:7px;
}

input,
textarea,
select{

width:100%;

padding:13px;

border:1px solid #ccc;

border-radius:8px;

font-size:16px;

}

textarea{
min-height:100px;
}

button{

padding:13px 18px;

border:0;

border-radius:8px;

font-size:16px;

font-weight:bold;

cursor:pointer;

margin-top:15px;

}

.save{
width:100%;
background:#168b70;
color:white;
}

.edit{
background:#1976d2;
color:white;
}

.delete{
background:#d32f2f;
color:white;
}

.logout{
background:#d32f2f;
color:white;
float:right;
}

.service{

background:#fafafa;

border-left:5px solid #b8860b;

padding:18px;

margin-top:15px;

border-radius:8px;

}

.service h3{
margin-top:0;
}

.message{
text-align:center;
font-weight:bold;
margin-top:15px;
}

</style>

</head>

<body>


<div class="header">

<button
class="logout"
onclick="logout()">

Logout

</button>

<h1>VDSKN.IN</h1>

<p>⚙️ ADMIN PANEL</p>

</div>


<div class="container">


<!-- SERVICE FORM -->

<div class="card">

<h2>
➕ ಸೇವೆ ಸೇರಿಸಿ / ಬದಲಾಯಿಸಿ
</h2>


<label>
Serial Number
</label>

<input
type="number"
id="serial"
placeholder="ಉದಾ: 1">


<label>
ಸೇವೆಯ ಹೆಸರು *
</label>

<input
type="text"
id="name"
placeholder="ಉದಾ: ಜಾತಿ ಮತ್ತು ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ">


<label>
ವಿಭಾಗ
</label>

<select id="category">

<option value="">
ವಿಭಾಗ ಆಯ್ಕೆ ಮಾಡಿ
</option>

<option>
ಕಂದಾಯ ಇಲಾಖೆ
</option>

<option>
ಶಿಕ್ಷಣ ಇಲಾಖೆ
</option>

<option>
ಆರೋಗ್ಯ ಇಲಾಖೆ
</option>

<option>
ಕಾರ್ಮಿಕ ಇಲಾಖೆ
</option>

<option>
ಇತರೆ
</option>

</select>


<label>
📄 Requirement Documents
</label>

<textarea
id="documents"
placeholder="ಆಧಾರ್ ಕಾರ್ಡ್
ರೇಷನ್ ಕಾರ್ಡ್
ಶಾಲಾ LC
ಆದಾಯದ ದಾಖಲೆ">
</textarea>


<label>
💰 ಶುಲ್ಕ
</label>

<input
type="text"
id="fee"
placeholder="ಉದಾ: ₹50">


<label>
⏱️ ಸೇವೆ ಪೂರ್ಣಗೊಳ್ಳುವ ಸಮಯ
</label>

<input
type="text"
id="time"
placeholder="ಉದಾ: 7 ದಿನಗಳು">


<label>
📝 ಸೇವೆಯ ಮಾಹಿತಿ
</label>

<textarea
id="description"
placeholder="ಸೇವೆಯ ಬಗ್ಗೆ ಮಾಹಿತಿ">
</textarea>


<button
class="save"
onclick="saveService()">

💾 SAVE SERVICE

</button>


<div
id="message"
class="message">
</div>

</div>


<!-- SERVICE LIST -->

<div class="card">

<h2>
📋 ಸೇವೆಗಳ ಪಟ್ಟಿ
</h2>

<div id="serviceList"></div>

</div>


</div>


<script>

/* ADMIN SECURITY */

if(
localStorage.getItem("adminLogin")
!=="true"
){

window.location.href=
"admin-login.html";

}


/* GET DATA */

let services=
JSON.parse(
localStorage.getItem("vdsServices")
)||[];


let editIndex=-1;


/* SAVE */

function saveService(){

let serial=
document.getElementById("serial").value;

let name=
document.getElementById("name").value.trim();

let category=
document.getElementById("category").value;

let documents=
document.getElementById("documents").value.trim();

let fee=
document.getElementById("fee").value.trim();

let time=
document.getElementById("time").value.trim();

let description=
document.getElementById("description").value.trim();


if(name===""){

alert("ಸೇವೆಯ ಹೆಸರನ್ನು ನಮೂದಿಸಿ");

return;

}


let data={

serial:serial ||
services.length+1,

name:name,

category:category,

documents:documents,

fee:fee,

time:time,

description:description

};


if(editIndex===-1){

services.push(data);

showMessage(
"✅ Service ಸೇರಿಸಲಾಗಿದೆ"
);

}else{

services[editIndex]=data;

editIndex=-1;

showMessage(
"✅ Service Update ಆಗಿದೆ"
);

}


localStorage.setItem(
"vdsServices",
JSON.stringify(services)
);


clearForm();

displayServices();

}


/* DISPLAY */

function displayServices(){

let list=
document.getElementById(
"serviceList"
);

list.innerHTML="";


if(services.length===0){

list.innerHTML=
"<p>ಯಾವುದೇ Service ಇಲ್ಲ.</p>";

return;

}


services.forEach(
function(service,index){

let box=
document.createElement(
"div"
);

box.className="service";


box.innerHTML=`

<h3>
${service.serial}. ${service.name}
</h3>

<p>
<b>ವಿಭಾಗ:</b>
${service.category || "-"}
</p>

<p>
<b>📄 Documents:</b><br>
${format(service.documents)}
</p>

<p>
<b>💰 Fee:</b>
${service.fee || "-"}
</p>

<p>
<b>⏱️ Time:</b>
${service.time || "-"}
</p>

<p>
<b>📝 ಮಾಹಿತಿ:</b><br>
${format(service.description)}
</p>

<button
class="edit"
onclick="editService(${index})">

✏️ Edit

</button>

<button
class="delete"
onclick="deleteService(${index})">

🗑️ Delete

</button>

`;


list.appendChild(box);

});

}


/* EDIT */

function editService(index){

let s=
services[index];


document.getElementById(
"serial"
).value=s.serial;

document.getElementById(
"name"
).value=s.name;

document.getElementById(
"category"
).value=s.category;

document.getElementById(
"documents"
).value=s.documents;

document.getElementById(
"fee"
).value=s.fee;

document.getElementById(
"time"
).value=s.time;

document.getElementById(
"description"
).value=s.description;


editIndex=index;


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* DELETE */

function deleteService(index){

if(
confirm(
"ಈ Service Delete ಮಾಡಬೇಕೇ?"
)
){

services.splice(index,1);

localStorage.setItem(
"vdsServices",
JSON.stringify(services)
);

displayServices();

}

}


/* CLEAR */

function clearForm(){

document.getElementById(
"serial"
).value="";

document.getElementById(
"name"
).value="";

document.getElementById(
"category"
).value="";

document.getElementById(
"documents"
).value="";

document.getElementById(
"fee"
).value="";

document.getElementById(
"time"
).value="";

document.getElementById(
"description"
).value="";

editIndex=-1;

}


/* FORMAT */

function format(text){

if(!text){

return "ಮಾಹಿತಿ ಇಲ್ಲ";

}

return text
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/\n/g,"<br>");

}


/* MESSAGE */

function showMessage(text){

document.getElementById(
"message"
).innerText=text;

setTimeout(
function(){

document.getElementById(
"message"
).innerText="";

},
2500
);

}


/* LOGOUT */

function logout(){

localStorage.removeItem(
"adminLogin"
);

window.location.href=
"admin-login.html";

}


/* START */

displayServices();

</script>

</body>

</html>
