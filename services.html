<!DOCTYPE html>
<html lang="kn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VDSKN - ಎಲ್ಲಾ ಸೇವೆಗಳು</title>

    <link rel="stylesheet" href="services.css">
</head>

<body>

<header class="top-header">

    <div class="brand">
        <img src="logo.png" alt="VDSKN Logo">

        <div>
            <h2>VDSKN ಡಿಜಿಟಲ್ ಸೇವಾ ಕೇಂದ್ರ</h2>
            <p>ಎಲ್ಲಾ ಆನ್‌ಲೈನ್ ಸೇವೆಗಳು ಒಂದೇ ಸ್ಥಳದಲ್ಲಿ</p>
        </div>
    </div>

    <a href="index.html" class="home-btn">
        🏠 Home
    </a>

</header>


<section class="service-header">

    <h1>📋 ಎಲ್ಲಾ ಸೇವೆಗಳು</h1>

    <p>
        ನಿಮಗೆ ಬೇಕಾದ ಸೇವೆಯನ್ನು ಹುಡುಕಿ ಮತ್ತು ಅಗತ್ಯ ದಾಖಲೆಗಳನ್ನು ನೋಡಿ
    </p>

</section>


<!-- SEARCH -->

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="🔎 ಸೇವೆಯ ಹೆಸರನ್ನು ಹುಡುಕಿ..."
        onkeyup="searchServices()"
    >

</div>


<!-- DEPARTMENT FILTER -->

<div class="departments">

    <button onclick="filterServices('all')">
        ಎಲ್ಲಾ
    </button>

    <button onclick="filterServices('revenue')">
        ಕಂದಾಯ ಇಲಾಖೆ
    </button>

    <button onclick="filterServices('aadhaar')">
        ಆಧಾರ್
    </button>

    <button onclick="filterServices('voter')">
        ಚುನಾವಣಾ
    </button>

    <button onclick="filterServices('certificate')">
        ಪ್ರಮಾಣ ಪತ್ರ
    </button>

    <button onclick="filterServices('other')">
        ಇತರೆ
    </button>

</div>


<!-- SERVICES -->

<main>

    <div id="serviceList" class="service-list"></div>

</main>


<!-- SERVICE DETAILS POPUP -->

<div id="serviceModal" class="modal">

    <div class="modal-content">

        <button class="close" onclick="closeModal()">×</button>

        <h2 id="modalTitle"></h2>

        <hr>

        <h3>📋 ಬೇಕಾದ ದಾಖಲೆಗಳು</h3>

        <ul id="modalDocuments"></ul>

        <br>

        <button
            id="applyButton"
            class="apply-btn">
            📝 Apply Now
        </button>

    </div>

</div>


<script src="services.js"></script>

</body>
</html>
