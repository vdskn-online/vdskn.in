<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDSKN - ಸೇವೆಗೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111;
}

.header{
    background:#111;
    color:white;
    text-align:center;
    padding:25px 15px;
}

.header h1{
    color:#ffd700;
    margin:0 0 8px;
    font-size:32px;
}

.header p{
    margin:0;
    font-size:17px;
}

.container{
    max-width:750px;
    margin:35px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

.title{
    text-align:center;
    color:#b8860b;
    font-size:28px;
    margin-bottom:20px;
}

.notice{
    background:#fff5cc;
    border-left:5px solid #c99700;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:18px;
    margin-bottom:7px;
    font-size:17px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.documents{
    background:#fff8dc;
    border-left:5px solid #c99700;
    padding:15px 20px;
    border-radius:8px;
    margin:20px 0;
}

.documents h3{
    margin-top:0;
    color:#9b7000;
}

.documents ul{
    margin-bottom:0;
    padding-left:25px;
}

.documents li{
    margin:9px 0;
}

.whatsapp{
    width:100%;
    border:0;
    background:#159b89;
    color:white;
    padding:15px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:25px;
}

.whatsapp:hover{
    background:#117c6f;
}

.back{
    width:100%;
    border:0;
    background:#333;
    color:white;
    padding:14px;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
    margin-top:15px;
}

.back:hover{
    background:#222;
}

.selected{
    background:#f8f8f8;
    border:1px solid #ddd;
    padding:12px;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
}

@media(max-width:600px){
    .container{
        margin:15px;
        padding:18px;
    }

    .header h1{
        font-size:27px;
    }

    .title{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>VDSKN.IN</h1>
    <p>Village Digital Seva Kendra</p>
</div>

<div class="container">

    <div class="title">
        📝 ಸೇವೆಗೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ
    </div>

    <div class="notice">
        📌 ಕೆಳಗಿನ ಮಾಹಿತಿಯನ್ನು ಸರಿಯಾಗಿ ನಮೂದಿಸಿ. ನಂತರ WhatsApp ಮೂಲಕ ಅರ್ಜಿ ಕಳುಹಿಸಬಹುದು.
    </div>

    <label>ಸೇವೆ</label>

    <div class="selected" id="selectedService">
        ಸೇವೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ...
    </div>

    <div class="documents">
        <h3>📋 ಬೇಕಾಗುವ ದಾಖಲೆಗಳು</h3>
        <ul id="documentList">
            <li>ಸೇವೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿದ ನಂತರ ದಾಖಲೆಗಳು ಇಲ್ಲಿ ಕಾಣಿಸುತ್ತವೆ.</li>
        </ul>
    </div>

    <label>ಅರ್ಜಿದಾರರ ಹೆಸರು</label>
    <input
        type="text"
        id="name"
        placeholder="ನಿಮ್ಮ ಪೂರ್ಣ ಹೆಸರು"
    >

    <label>ಮೊಬೈಲ್ ಸಂಖ್ಯೆ</label>
    <input
        type="tel"
        id="mobile"
        maxlength="10"
        placeholder="10 ಅಂಕೆಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
    >

    <label>ಆಧಾರ್ ಸಂಖ್ಯೆ</label>
    <input
        type="text"
        id="aadhaar"
        maxlength="12"
        placeholder="ಆಧಾರ್ ಸಂಖ್ಯೆ"
    >

    <label>ವಿಳಾಸ</label>
    <textarea
        id="address"
        placeholder="ಪೂರ್ಣ ವಿಳಾಸ"
    ></textarea>

    <label>ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ</label>
    <textarea
        id="message"
        placeholder="ಅಗತ್ಯವಿದ್ದರೆ ಹೆಚ್ಚಿನ ಮಾಹಿತಿ ನಮೂದಿಸಿ"
    ></textarea>

    <button class="whatsapp" onclick="sendWhatsApp()">
        📱 WhatsApp ಮೂಲಕ ಅರ್ಜಿ ಕಳುಹಿಸಿ
    </button>

    <button class="back" onclick="goBack()">
        ← ಎಲ್ಲಾ ಸೇವೆಗಳಿಗೆ ಹಿಂತಿರುಗಿ
    </button>

</div>

/* =========================================
   LOAD SELECTED SERVICE
========================================= */

const selected =
    localStorage.getItem("selectedService");


function showService(){

    const serviceBox =
        document.getElementById("selectedService");

    const documentList =
        document.getElementById("documentList");

    if(!selected){

        serviceBox.innerText =
            "ಯಾವುದೇ ಸೇವೆ ಆಯ್ಕೆ ಮಾಡಲಾಗಿಲ್ಲ.";

        documentList.innerHTML =
            "<li>ದಯವಿಟ್ಟು ಸೇವೆಗಳ ಪುಟಕ್ಕೆ ಹಿಂತಿರುಗಿ ಸೇವೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ.</li>";

        return;
    }

    serviceBox.innerText = selected;

    let docs = serviceDocuments[selected];

    /*
       ServiceDocuments ನಲ್ಲಿ service ಇಲ್ಲದಿದ್ದರೆ
       ಸಾಮಾನ್ಯ documents ತೋರಿಸುತ್ತದೆ.
    */

    if(!docs){

        docs = [
            "ಆಧಾರ್ ಕಾರ್ಡ್",
            "ಮೊಬೈಲ್ ಸಂಖ್ಯೆ",
            "ವಿಳಾಸದ ದಾಖಲೆ",
            "ಸಂಬಂಧಿಸಿದ ಸೇವೆಯ ಅಗತ್ಯ ದಾಖಲೆಗಳು"
        ];
    }

    documentList.innerHTML = "";

    docs.forEach(function(doc){

        const li =
            document.createElement("li");

        li.innerHTML =
            "✅ " + doc;

        documentList.appendChild(li);

    });

}


/* =========================================
   WHATSAPP
========================================= */

function sendWhatsApp(){

    const name =
        document.getElementById("name").value.trim();

    const mobile =
        document.getElementById("mobile").value.trim();

    const aadhaar =
        document.getElementById("aadhaar").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const message =
        document.getElementById("message").value.trim();


    if(!selected){

        alert("ದಯವಿಟ್ಟು ಮೊದಲು ಸೇವೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ.");

        return;
    }


    if(!name){

        alert("ದಯವಿಟ್ಟು ಅರ್ಜಿದಾರರ ಹೆಸರನ್ನು ನಮೂದಿಸಿ.");

        document.getElementById("name").focus();

        return;
    }


    if(!mobile){

        alert("ದಯವಿಟ್ಟು ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ.");

        document.getElementById("mobile").focus();

        return;
    }


    if(!/^[0-9]{10}$/.test(mobile)){

        alert("ದಯವಿಟ್ಟು ಸರಿಯಾದ 10 ಅಂಕೆಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ.");

        document.getElementById("mobile").focus();

        return;
    }


    let text =
`📋 *VDSKN.IN - ಸೇವೆಗೆ ಅರ್ಜಿ*

🔹 *ಸೇವೆ:* ${selected}

👤 *ಅರ್ಜಿದಾರರ ಹೆಸರು:* ${name}

📱 *ಮೊಬೈಲ್ ಸಂಖ್ಯೆ:* ${mobile}

🪪 *ಆಧಾರ್ ಸಂಖ್ಯೆ:* ${aadhaar || "ನಮೂದಿಸಿಲ್ಲ"}

🏠 *ವಿಳಾಸ:*
${address || "ನಮೂದಿಸಿಲ್ಲ"}

📝 *ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ:*
${message || "ಇಲ್ಲ"}

━━━━━━━━━━━━━━
VDSKN.IN
Village Digital Seva Kendra`;


    const whatsappNumber =
        "918095713511";


    const whatsappURL =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(text);


    window.open(
        whatsappURL,
        "_blank"
    );

}


/* =========================================
   BACK
========================================= */
