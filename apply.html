<!DOCTYPE html>
<html lang="kn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDSKN - ಸೇವೆಗೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
}

.container{
max-width:750px;
margin:30px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 4px 15px #ccc;
}

h1{
text-align:center;
color:#b8860b;
margin-bottom:25px;
}

label{
display:block;
font-weight:bold;
font-size:17px;
margin-top:18px;
margin-bottom:7px;
}

input,textarea,select{
width:100%;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

textarea{
min-height:100px;
resize:vertical;
}

.documents{
background:#fff8dc;
border-left:5px solid #d4a000;
padding:15px;
border-radius:10px;
margin:20px 0;
}

.documents h2{
margin-top:0;
color:#b8860b;
}

.documents li{
margin:10px 0;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:8px;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}

.whatsapp{
background:#129b87;
color:white;
}

.back{
background:#333;
color:white;
}

</style>
</head>

<body>

<div class="container">

<h1>📝 ಸೇವೆಗೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ</h1>

<label>ಸೇವೆ</label>

<input
type="text"
id="service"
readonly
>

<div class="documents">

<h2>📋 ಬೇಕಾಗುವ ದಾಖಲೆಗಳು</h2>

<ul id="documentsList">
<li>ದಾಖಲೆಗಳ ಮಾಹಿತಿ ಪಡೆಯಲು ಸೇವೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ</li>
</ul>

</div>

<label>ಅರ್ಜಿದಾರರ ಹೆಸರು</label>

<input
type="text"
id="name"
placeholder="ಪೂರ್ಣ ಹೆಸರು"
>

<label>ಮೊಬೈಲ್ ಸಂಖ್ಯೆ</label>

<input
type="tel"
id="mobile"
placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
maxlength="10"
>

<label>ಆಧಾರ್ ಸಂಖ್ಯೆ</label>

<input
type="text"
id="aadhaar"
placeholder="ಆಧಾರ್ ಸಂಖ್ಯೆ"
maxlength="12"
>

<label>ವಿಳಾಸ</label>

<textarea
id="address"
placeholder="ಪೂರ್ಣ ವಿಳಾಸ">
</textarea>

<label>ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ</label>

<textarea
id="message"
placeholder="ಅಗತ್ಯವಿದ್ದರೆ ಮಾಹಿತಿ ನಮೂದಿಸಿ">
</textarea>

<button
class="whatsapp"
onclick="sendWhatsApp()">
📱 WhatsApp ಮೂಲಕ ಅರ್ಜಿ ಕಳುಹಿಸಿ
</button>

<button
class="back"
onclick="location.href='services.html'">
⬅ ಎಲ್ಲಾ ಸೇವೆಗಳಿಗೆ ಹಿಂತಿರುಗಿ
</button>

</div>

<script>

/* ಆಯ್ಕೆ ಮಾಡಿದ Service ಪಡೆಯುವುದು */

const selectedService =
localStorage.getItem("selectedService");

/* Service ತೋರಿಸುವುದು */

if(selectedService){

document.getElementById("service").value =
selectedService;

}

/* ದಾಖಲೆಗಳ ಮಾಹಿತಿ */

const documents = {

"ಜಾತಿ ಪ್ರಮಾಣ ಪತ್ರ":[
"ಆಧಾರ್ ಕಾರ್ಡ್",
"ರೇಷನ್ ಕಾರ್ಡ್",
"ಶಾಲಾ ದೃಢೀಕರಣ / LC",
"ಆದಾಯದ ದಾಖಲೆ",
"ಆಧಾರ್ ಲಿಂಕ್ ಇರುವ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
],

"ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ":[
"ಆಧಾರ್ ಕಾರ್ಡ್",
"ರೇಷನ್ ಕಾರ್ಡ್",
"ಆದಾಯದ ದಾಖಲೆ",
"ಆಧಾರ್ ಲಿಂಕ್ ಇರುವ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
],

"ವಾಸಸ್ಥಳ ಪ್ರಮಾಣ ಪತ್ರ":[
"ಆಧಾರ್ ಕಾರ್ಡ್",
"ರೇಷನ್ ಕಾರ್ಡ್",
"ವಾಸಸ್ಥಳದ ದಾಖಲೆ",
"ಆಧಾರ್ ಲಿಂಕ್ ಇರುವ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
],

"RTC / ಪಹಣಿ":[
"ಆಧಾರ್ ಕಾರ್ಡ್",
"RTC / ಪಹಣಿ ವಿವರ",
"ಜಮೀನಿನ ವಿವರ",
"ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
],

"PAN Card":[
"ಆಧಾರ್ ಕಾರ್ಡ್",
"ಮೊಬೈಲ್ ಸಂಖ್ಯೆ",
"ಫೋಟೋ",
"ಇಮೇಲ್ ID"
],

"PAN Correction":[
"PAN Card",
"ಆಧಾರ್ ಕಾರ್ಡ್",
"ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
]

};

if(selectedService && documents[selectedService]){

const list =
document.getElementById("documentsList");

list.innerHTML="";

documents[selectedService].forEach(function(doc){

const li=document.createElement("li");

li.innerHTML="✅ "+doc;

list.appendChild(li);

});

}


/* WhatsApp */

function sendWhatsApp(){

const service =
document.getElementById("service").value;

const name =
document.getElementById("name").value;

const mobile =
document.getElementById("mobile").value;

const aadhaar =
document.getElementById("aadhaar").value;

const address =
document.getElementById("address").value;

const message =
document.getElementById("message").value;


if(!name){

alert("ದಯವಿಟ್ಟು ಅರ್ಜಿದಾರರ ಹೆಸರನ್ನು ನಮೂದಿಸಿ");

return;

}

if(!mobile || mobile.length != 10){

alert("ದಯವಿಟ್ಟು ಸರಿಯಾದ 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ");

return;

}


const text =
"📝 VDSKN ಸೇವೆ ಅರ್ಜಿ%0A%0A"+
"ಸೇವೆ: "+service+"%0A"+
"ಹೆಸರು: "+name+"%0A"+
"ಮೊಬೈಲ್: "+mobile+"%0A"+
"ಆಧಾರ್: "+aadhaar+"%0A"+
"ವಿಳಾಸ: "+address+"%0A"+
"ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ: "+message;


const whatsapp =
"https://wa.me/918095713511?text="+
encodeURIComponent(text);


window.open(whatsapp,"_blank");

}

</script>

</body>
</html>
