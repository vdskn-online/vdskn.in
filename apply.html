    font-family:Arial,sans-serif;

}

h2{

}

label{

input,textarea,select{

    padding:12px;

textarea{

    margin-top:25px;

<body>

<div class="header">
    <h1>VDSKN.IN</h1>
    <p>Village Digital Seva Kendra</p>
</div>

<div class="container">

<h2>📝 ಸೇವೆಗೆ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ</h2>

<label>ಸೇವೆ</label>

<select id="service" onchange="showDocuments()" required>

<option value="">-- ಸೇವೆ ಆಯ್ಕೆ ಮಾಡಿ --</option>

<option>ಜಾತಿ ಪ್ರಮಾಣ ಪತ್ರ</option>
<option>ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ</option>
<option>ಜಾತಿ ಮತ್ತು ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ</option>
<option>ವಾಸಸ್ಥಳ ಪ್ರಮಾಣ ಪತ್ರ</option>
<option>ಜಮೀನು ದಾಖಲೆ ಸೇವೆಗಳು</option>
<option>RTC / ಪಹಣಿ</option>

<option>ಆಧಾರ್ ಸೇವೆಗಳು</option>
<option>PAN Card</option>
<option>PAN Correction</option>

<option>ವಿದ್ಯಾರ್ಥಿ ಪ್ರಮಾಣ ಪತ್ರ</option>
<option>ವಿದ್ಯಾರ್ಥಿವೇತನ ಅರ್ಜಿ</option>

<option>ಬ್ಯಾಂಕ್ ಖಾತೆ ಸೇವೆಗಳು</option>
<option>ವಿಮೆ ಸೇವೆಗಳು</option>

<option>Driving Licence</option>
<option>Vehicle Registration</option>

<option>ಇತರೆ ಸೇವೆ</option>

</select>

<div id="documents" class="documents" style="display:none;">
    <h3>📋 ಬೇಕಾಗುವ ದಾಖಲೆಗಳು</h3>
    <ul id="documentList"></ul>
</div>

<label>ಅರ್ಜಿದಾರರ ಹೆಸರು</label>
<input type="text" id="name" placeholder="ಪೂರ್ಣ ಹೆಸರು" required>

<label>ಮೊಬೈಲ್ ಸಂಖ್ಯೆ</label>
<input type="tel" id="mobile"
       placeholder="10 ಅಂಕೆಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
       maxlength="10"
       required>

<label>ಆಧಾರ್ ಸಂಖ್ಯೆ</label>
<input type="text" id="aadhaar"
       placeholder="ಆಧಾರ್ ಸಂಖ್ಯೆ">

<label>ವಿಳಾಸ</label>
<textarea id="address"
placeholder="ಪೂರ್ಣ ವಿಳಾಸ"></textarea>

<label>ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ</label>
<textarea id="message"
placeholder="ಅಗತ್ಯವಿದ್ದರೆ ಮಾಹಿತಿ ನಮೂದಿಸಿ"></textarea>

<button onclick="sendWhatsApp()">
📲 WhatsApp ಮೂಲಕ ಅರ್ಜಿ ಕಳುಹಿಸಿ
</button>

<button class="back"
onclick="location.href='services.html'">
⬅ ಎಲ್ಲಾ ಸೇವೆಗಳಿಗೆ ಹಿಂತಿರುಗಿ
</button>

</div>

]

};


function showDocuments(){

    const service =
    document.getElementById("service").value;

    const box =
    document.getElementById("documents");

    const list =
    document.getElementById("documentList");

    list.innerHTML="";

    if(!service || !documents[service]){
        box.style.display="none";
        return;
    }

    documents[service].forEach(function(doc){

        const li=document.createElement("li");

        li.textContent="✅ "+doc;

        list.appendChild(li);

    });

    box.style.display="block";
}


function sendWhatsApp(){

    const service =
    document.getElementById("service").value;

    const name =
    document.getElementById("name").value;

    const mobile =
    document.getElementById("mobile").value;

    const aadhaar =
    document.getElementById("aadhaar").value;

    const address =
    document.getElementById("address").value;

    const message =
    document.getElementById("message").value;


    if(!service){
        alert("ದಯವಿಟ್ಟು ಸೇವೆಯನ್ನು ಆಯ್ಕೆ ಮಾಡಿ.");
        return;
    }

    if(!name){
        alert("ದಯವಿಟ್ಟು ಅರ್ಜಿದಾರರ ಹೆಸರನ್ನು ನಮೂದಿಸಿ.");
        return;
    }

    if(mobile.length !== 10){
        alert("ದಯವಿಟ್ಟು ಸರಿಯಾದ 10 ಅಂಕೆಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ.");
        return;
    }


    let text =
`VDSKN.IN - ಸೇವೆ ಅರ್ಜಿ

ಸೇವೆ: ${service}

ಅರ್ಜಿದಾರರ ಹೆಸರು: ${name}

ಮೊಬೈಲ್ ಸಂಖ್ಯೆ: ${mobile}

ಆಧಾರ್ ಸಂಖ್ಯೆ: ${aadhaar}

ವಿಳಾಸ:
${address}

ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ:
${message}`;


    const whatsapp =
    "https://wa.me/918095713511?text="
    +encodeURIComponent(text);


    window.open(whatsapp,"_blank");

}


/* services.html ಇಂದ ಬಂದ service ಅನ್ನು ಪಡೆಯಲು */

const selected =
localStorage.getItem("selectedService");

if(selected){

    const select =
    document.getElementById("service");

    select.value=selected;

    showDocuments();

    localStorage.removeItem("selectedService");
}

</script>

</html>
