<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VDSKN - ಸೇವೆಗೆ ಅರ್ಜಿ</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}

.header{
    background:#111;
    color:white;
    text-align:center;
    padding:25px 15px;
}

.header h1{
    margin:0;
    color:#ffd400;
    font-size:32px;
}

.header p{
    margin:8px 0 0;
    font-size:16px;
}

.header h2{
    margin:18px 0 0;
    font-size:25px;
}

.container{
    max-width:750px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px #ccc;
    margin-bottom:20px;
}

.service-title{
    background:#c28b00;
    color:white;
    padding:15px;
    border-radius:8px;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:6px;
}

input,select,textarea{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.documents{
    background:#fff8dc;
    border-left:5px solid #c28b00;
    padding:15px;
    border-radius:6px;
    margin-top:15px;
}

.documents h3{
    margin-top:0;
    color:#a87500;
}

.documents li{
    margin:8px 0;
}

.btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

.submit{
    background:#198754;
    color:white;
}

.whatsapp{
    background:#25d366;
    color:white;
}

.back{
    background:#333;
    color:white;
}

.success{
    display:none;
    background:#d1e7dd;
    color:#0f5132;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
    text-align:center;
    font-weight:bold;
}

@media(max-width:600px){
    .header h1{
        font-size:26px;
    }

    .card{
        padding:18px;
    }

    .service-title{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="header">

<h1>VDSKN.IN</h1>

<p>Village Digital Seva Kendra</p>

<h2>📝 ಸೇವೆಗೆ ಅರ್ಜಿ</h2>

</div>


<div class="container">

<div class="card">

<div class="service-title">
📌 <span id="serviceName">ಸೇವೆ</span>
</div>


<div class="documents">

<h3>📄 ಬೇಕಾಗುವ ದಾಖಲೆಗಳು</h3>

<ul id="documentList">
<li>ದಾಖಲೆಗಳನ್ನು ಲೋಡ್ ಮಾಡಲಾಗುತ್ತಿದೆ...</li>
</ul>

</div>



<div class="card">

<h2>👤 ಅರ್ಜಿದಾರರ ವಿವರ</h2>

<label>ಅರ್ಜಿದಾರರ ಹೆಸರು *</label>

<input
type="text"
id="name"
placeholder="ನಿಮ್ಮ ಪೂರ್ಣ ಹೆಸರು"
required
>


<label>ಮೊಬೈಲ್ ಸಂಖ್ಯೆ *</label>

<input
type="tel"
id="mobile"
placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
maxlength="10"
required
>


<label>ಆಧಾರ್ ಸಂಖ್ಯೆ</label>

<input
type="text"
id="aadhaar"
placeholder="ಆಧಾರ್ ಸಂಖ್ಯೆ"
maxlength="12"
>


<label>ವಿಳಾಸ *</label>

<textarea
id="address"
placeholder="ನಿಮ್ಮ ಪೂರ್ಣ ವಿಳಾಸ"
></textarea>


<label>ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ</label>

<textarea
id="message"
placeholder="ಅಗತ್ಯವಿದ್ದರೆ ಮಾಹಿತಿ ನಮೂದಿಸಿ"
></textarea>


<button
class="btn submit"
onclick="submitApplication()"
>
✅ ಅರ್ಜಿ ಸಲ್ಲಿಸಿ
</button>


<button
class="btn whatsapp"
onclick="sendWhatsApp()"
>
💬 WhatsApp ಮೂಲಕ ಕಳುಹಿಸಿ
</button>


<button
class="btn back"
onclick="goBack()"
>
⬅️ ಸೇವೆಗಳ ಪಟ್ಟಿಗೆ ಹಿಂತಿರುಗಿ
</button>


<div
id="success"
class="success"
>
✅ ನಿಮ್ಮ ಅರ್ಜಿ ವಿವರಗಳು ಸಿದ್ಧವಾಗಿದೆ.
<br>
VDSKN ಕೇಂದ್ರವನ್ನು ಸಂಪರ್ಕಿಸಿ.
</div>

</div>

</div>


<script>

let selectedService =
    const serviceDocuments = {

    "ಜಾತಿ ಮತ್ತು ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ": [
        "ಆಧಾರ್ ಕಾರ್ಡ್",
        "ರೇಷನ್ ಕಾರ್ಡ್",
        "ಶಾಲಾ ದೃಢೀಕರಣ / LC",
        "ಆದಾಯದ ದಾಖಲೆ",
        "ಆಧಾರ್‌ಗೆ ಲಿಂಕ್ ಇರುವ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
    ],

    "ಆದಾಯ ಪ್ರಮಾಣ ಪತ್ರ": [
        "ಆಧಾರ್ ಕಾರ್ಡ್",
        "ರೇಷನ್ ಕಾರ್ಡ್",
        "ಆದಾಯದ ದಾಖಲೆ",
        "ಆಧಾರ್‌ಗೆ ಲಿಂಕ್ ಇರುವ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
    ],

    "ವಾಸಸ್ಥಳ ಪ್ರಮಾಣ ಪತ್ರ": [
        "ಆಧಾರ್ ಕಾರ್ಡ್",
        "ರೇಷನ್ ಕಾರ್ಡ್",
        "ವಾಸಸ್ಥಳದ ದಾಖಲೆ",
        "ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
    ],

    "RTC / ಪಹಣಿ": [
        "ಆಧಾರ್ ಕಾರ್ಡ್",
        "RTC / ಪಹಣಿ ವಿವರ",
        "ಜಮೀನಿನ ದಾಖಲೆ",
        "ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
    ],

    "ಅಫಿಡವಿಟ್ ಸೇವೆಗಳು": [
        "ಆಧಾರ್ ಕಾರ್ಡ್",
        "ಅಗತ್ಯವಿರುವ ದಾಖಲೆಗಳು",
        "ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"
    ]

};


function loadDocuments(){

    const list =
    document.getElementById("documentList");

    if(!list) return;

    const documents =
    serviceDocuments[selectedService];

    list.innerHTML = "";

    if(documents){

        documents.forEach(function(doc){

            const li =
            document.createElement("li");

            li.textContent = doc;

            list.appendChild(li);

        });

    }else{

        const li =
        document.createElement("li");

        li.textContent =
        "ಸಂಬಂಧಿಸಿದ ದಾಖಲೆಗಳಿಗಾಗಿ VDSKN ಕೇಂದ್ರವನ್ನು ಸಂಪರ್ಕಿಸಿ.";

        list.appendChild(li);

    }

}


loadDocuments();
localStorage.getItem("selectedService");


if(!selectedService || selectedService.trim()===""){

    selectedService="ಸೇವೆ";

}


document.getElementById("serviceName").innerText =
selectedService;



function getData(){

    let name =
    document.getElementById("name").value.trim();

    let mobile =
    document.getElementById("mobile").value.trim();

    let aadhaar =
    document.getElementById("aadhaar").value.trim();

    let address =
    document.getElementById("address").value.trim();

    let message =
    document.getElementById("message").value.trim();


    return {
        name,
        mobile,
        aadhaar,
        address,
        message
    };

}



function submitApplication(){

    let data=getData();


    if(data.name===""){

        alert("ದಯವಿಟ್ಟು ಅರ್ಜಿದಾರರ ಹೆಸರು ನಮೂದಿಸಿ.");

        return;

    }


    if(!/^[0-9]{10}$/.test(data.mobile)){

        alert("ದಯವಿಟ್ಟು ಸರಿಯಾದ 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ.");

        return;

    }


    if(data.address===""){

        alert("ದಯವಿಟ್ಟು ವಿಳಾಸ ನಮೂದಿಸಿ.");

        return;

    }


    localStorage.setItem(
        "applicationData",
        JSON.stringify(data)
    );


    document.getElementById("success").style.display="block";


    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}



function sendWhatsApp(){

    let data=getData();


    if(data.name===""){

        alert("ದಯವಿಟ್ಟು ಹೆಸರು ನಮೂದಿಸಿ.");

        return;

    }


    if(!/^[0-9]{10}$/.test(data.mobile)){

        alert("ದಯವಿಟ್ಟು ಸರಿಯಾದ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ.");

        return;

    }


    let text =
`VDSKN ಸೇವೆಗೆ ಅರ್ಜಿ

ಸೇವೆ: ${selectedService}

ಹೆಸರು: ${data.name}

ಮೊಬೈಲ್: ${data.mobile}

ಆಧಾರ್: ${data.aadhaar}

ವಿಳಾಸ: ${data.address}

ಹೆಚ್ಚುವರಿ ಮಾಹಿತಿ: ${data.message}`;


    let phone="919740221511";


    let url =
    "https://wa.me/"+phone+
    "?text="+encodeURIComponent(text);


    window.open(url,"_blank");

}



function goBack(){

    window.location.href="services.html";

}

</script>

</body>
</html>
